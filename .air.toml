root = "."
tmp_dir = "tmp"

[build]
cmd = "go run scripts/generate-routes.go && go build -o ./tmp/syndi ./cmd"
entrypoint = "./tmp/syndi"

include_ext = ["go", "yaml"]
exclude_dir = ["build", "tmp", "data", "docs", "RSSHub-ref", "scripts"]
include_dir = []
exclude_file = ["cmd/routes_gen.go"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 2000

[log]
time = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
