{{define "cred-panel"}}
<section>
    <span class="label">Credentials</span>
    {{range .RouteEnvStatuses}}
    <div class="cred">
        <div class="cred-key">{{.Key}}</div>
        <dl class="kv">
            {{range .Fields}}
            <dt>{{.Name}}</dt>
            <dd class="st {{if .Present}}yes{{else}}no{{end}}">{{if .Present}}ok{{else}}missing{{end}}</dd>
            {{end}}
        </dl>
    </div>
    {{end}}
</section>
{{end}}
