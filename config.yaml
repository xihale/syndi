# RSSHub Go Configuration File
# This file controls the behavior of the RSSHub Go server

# Server settings
server:
  # Port to listen on
  port: "1200"
  # Environment: production, development, or test
  env: "production"
  # Server timeouts
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

# Cache settings
cache:
  # Cache type: memory or badger (badger = two-tier cache with persistence)
  type: "badger"
  # BadgerDB configuration (only used if type is "badger")
  badger:
     path: "./data/cache"
  # Cleanup interval for expired cache entries in Badger (e.g., 5m, 1h)
  cleanup_interval: 5m
  # Cache time-to-live for feeds
  ttl: 15m
  # Memory cache size (number of items)
  memory_size: 10000
  # --- Badger memory tuning (0 = built-in default) ---
  # Per-memtable budget; total memtable memory ~= memtable_mb * num_memtables
  memtable_mb: 16
  num_memtables: 4
  # Data block cache budget
  block_cache_mb: 32
  # Index cache budget; 0 lets Badger size it automatically
  index_cache_mb: 0
  # Max size of one value-log file; smaller files rewrite faster during GC
  vlog_file_mb: 128
  # --- Disk reclamation ---
  # How often to rewrite value-log files that hold mostly stale data.
  # Without this, deleted/expired entries never return their disk space.
  # Set to 0s to disable (not recommended for long-running instances).
  gc_interval: 10m
  # Fraction of garbage a value-log file must contain before rewrite
  gc_discard_ratio: 0.5

# HTTP client settings
client:
  # User agent string for HTTP requests
  user_agent: "Syndi/0.0.1 (+https://github.com/xihale/syndi)"
  # Request timeout
  timeout: 30s
  # Maximum number of redirects to follow
  max_redirects: 10
  # Proxy URL (leave empty to disable proxy)
  proxy: ""
  # Disable all proxy usage (overrides proxy and environment proxy settings)
  no_proxy: false

# Route settings
routes:
  # Disable NSFW (Not Safe For Work) routes
  disable_nsfw: false

# Middleware settings
middleware:
  # Enable response caching
  enable_cache: true
  # Access key for restricted routes (leave empty for no authentication)
  access_key: ""
  # CORS allowed origin
  allow_origin: "*"
